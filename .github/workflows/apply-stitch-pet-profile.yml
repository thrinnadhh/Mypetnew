name: apply-stitch-pet-profile

on:
  push:
    branches:
      - restore/customer-app-from-mypet

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/customer-app-from-mypet
          fetch-depth: 0

      - name: Add Stitch-referenced pet management to Customer Profile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          profile = Path('apps/customer-app/src/screens/profile-screen.tsx')
          s = profile.read_text()

          s = s.replace(
              "} from '@/services/customer-profile';\n",
              "} from '@/services/customer-profile';\nimport { createCustomerPet, fetchCustomerPets, type CustomerPet } from '@/services/customer-pets';\n",
          )
          s = s.replace(
              "type AddressDraft = Record<keyof AddressInput, string>;\nconst emptyAddress: AddressDraft = { label: 'Home', line1: '', line2: '', city: 'Tirupati', state: 'Andhra Pradesh', pincode: '', geoLat: '', geoLng: '' };\n",
              "type AddressDraft = Record<keyof AddressInput, string>;\ntype PetDraft = { name: string; species: 'DOG' | 'CAT' | 'OTHER'; breed: string; dateOfBirth: string };\nconst emptyAddress: AddressDraft = { label: 'Home', line1: '', line2: '', city: 'Tirupati', state: 'Andhra Pradesh', pincode: '', geoLat: '', geoLng: '' };\nconst emptyPet: PetDraft = { name: '', species: 'DOG', breed: '', dateOfBirth: '' };\n",
          )
          s = s.replace(
              "  const [saving, setSaving] = useState(false);\n",
              "  const [saving, setSaving] = useState(false);\n  const [pets, setPets] = useState<CustomerPet[]>([]);\n  const [loadingPets, setLoadingPets] = useState(false);\n  const [petsError, setPetsError] = useState<'offline' | 'error' | null>(null);\n  const [showAddPet, setShowAddPet] = useState(false);\n  const [petDraft, setPetDraft] = useState<PetDraft>(emptyPet);\n  const [savingPet, setSavingPet] = useState(false);\n",
          )
          s = s.replace(
              "  useEffect(() => {\n    if (!user || !session) return;\n    void loadAddress();\n  }, [loadAddress, session, user]);\n",
              "  const loadPets = useCallback(async () => {\n    if (!session) return;\n    setLoadingPets(true); setPetsError(null);\n    try { setPets(await fetchCustomerPets(session.access_token)); }\n    catch (error) { setPetsError(isOfflineError(error) ? 'offline' : 'error'); }\n    finally { setLoadingPets(false); }\n  }, [session]);\n\n  useEffect(() => {\n    if (!user || !session) return;\n    void loadAddress();\n    void loadPets();\n  }, [loadAddress, loadPets, session, user]);\n",
          )

          guest_needle = "  if (!user || !session) return (\n"
          save_pet = """  const savePet = useCallback(async () => {\n    if (!session) return;\n    const name = petDraft.name.trim();\n    if (!name || !petDraft.species) {\n      Alert.alert(t('common.error'), t('profileFoundation.petRequired'));\n      return;\n    }\n\n    setSavingPet(true);\n    try {\n      const created = await createCustomerPet({\n        name,\n        species: petDraft.species,\n        breed: petDraft.breed.trim() || null,\n        dateOfBirth: petDraft.dateOfBirth.trim() || null,\n      }, session.access_token);\n      setPets((current) => [...current, created]);\n      setPetDraft(emptyPet);\n      setShowAddPet(false);\n      Alert.alert(t('common.success'), t('profileFoundation.petSaved'));\n    } catch (error) {\n      Alert.alert(\n        t('common.error'),\n        isOfflineError(error)\n          ? t('states.offlineMessage')\n          : error instanceof Error ? error.message : t('states.errorMessage'),\n      );\n    } finally {\n      setSavingPet(false);\n    }\n  }, [petDraft, session, t]);\n\n"""
          if guest_needle not in s:
              raise SystemExit('Profile guest boundary not found')
          s = s.replace(guest_needle, save_pet + guest_needle, 1)

          delivery_needle = "      <SectionHeader title={t('profileFoundation.deliveryAddress')} />\n"
          pets_ui = """      <SectionHeader\n        title={t('profileFoundation.myPets')}\n        actionLabel={showAddPet ? t('common.cancel') : t('profileFoundation.addPet')}\n        onAction={() => setShowAddPet((current) => !current)}\n      />\n      {loadingPets ? <StateView kind=\"loading\" title={t('states.loading')} /> : null}\n      {petsError ? (\n        <StateView\n          kind={petsError}\n          title={t(petsError === 'offline' ? 'states.offline' : 'profileFoundation.petsLoadError')}\n          message={t(petsError === 'offline' ? 'states.offlineMessage' : 'states.errorMessage')}\n          actionLabel={t('states.retry')}\n          onAction={() => void loadPets()}\n        />\n      ) : null}\n      {!loadingPets && !petsError ? (\n        <View style={styles.stack}>\n          {pets.length === 0 ? (\n            <StateView kind=\"empty\" title={t('profileFoundation.petsEmpty')} message={t('profileFoundation.petsEmptyMessage')} />\n          ) : (\n            <View style={styles.petGrid}>\n              {pets.map((pet) => (\n                <View key={pet.petId} style={[styles.petCard, { backgroundColor: theme.backgroundElement, borderColor: theme.border }]}>\n                  <View style={[styles.petAvatar, { backgroundColor: theme.primarySoft }]}>\n                    <AppIcon name=\"paw\" color={theme.primary} size={28} />\n                  </View>\n                  <ThemedText style={styles.petName} numberOfLines={1}>{pet.name}</ThemedText>\n                  <ThemedText type=\"small\" themeColor=\"textSecondary\" numberOfLines={2}>\n                    {[pet.species, pet.breed].filter(Boolean).join(' · ')}\n                  </ThemedText>\n                </View>\n              ))}\n            </View>\n          )}\n\n          {showAddPet ? (\n            <View style={[styles.petForm, { backgroundColor: theme.backgroundElement, borderColor: theme.border }]}>\n              <TextInput\n                value={petDraft.name}\n                onChangeText={(value) => setPetDraft((current) => ({ ...current, name: value }))}\n                placeholder={t('profileFoundation.petNamePlaceholder')}\n                placeholderTextColor={theme.textSecondary}\n                style={[styles.input, { color: theme.text, backgroundColor: theme.backgroundElement, borderColor: theme.border }]}\n                accessibilityLabel={t('profileFoundation.petName')}\n              />\n              <View style={styles.speciesRow}>\n                {(['DOG', 'CAT', 'OTHER'] as const).map((species) => {\n                  const selected = petDraft.species === species;\n                  const labelKey = species === 'DOG' ? 'dog' : species === 'CAT' ? 'cat' : 'other';\n                  return (\n                    <Pressable\n                      key={species}\n                      onPress={() => setPetDraft((current) => ({ ...current, species }))}\n                      accessibilityRole=\"button\"\n                      accessibilityState={{ selected }}\n                      style={[styles.speciesChip, { backgroundColor: selected ? theme.primarySoft : theme.backgroundElement, borderColor: selected ? theme.primary : theme.border }]}\n                    >\n                      <ThemedText type=\"small\" style={{ color: selected ? theme.primary : theme.text, fontWeight: '700' }}>{t(`profileFoundation.${labelKey}`)}</ThemedText>\n                    </Pressable>\n                  );\n                })}\n              </View>\n              <TextInput\n                value={petDraft.breed}\n                onChangeText={(value) => setPetDraft((current) => ({ ...current, breed: value }))}\n                placeholder={t('profileFoundation.breedOptional')}\n                placeholderTextColor={theme.textSecondary}\n                style={[styles.input, { color: theme.text, backgroundColor: theme.backgroundElement, borderColor: theme.border }]}\n                accessibilityLabel={t('profileFoundation.breedOptional')}\n              />\n              <TextInput\n                value={petDraft.dateOfBirth}\n                onChangeText={(value) => setPetDraft((current) => ({ ...current, dateOfBirth: value }))}\n                placeholder={t('profileFoundation.dateOfBirthOptional')}\n                placeholderTextColor={theme.textSecondary}\n                style={[styles.input, { color: theme.text, backgroundColor: theme.backgroundElement, borderColor: theme.border }]}\n                accessibilityLabel={t('profileFoundation.dateOfBirthOptional')}\n              />\n              <PrimaryAction label={t('profileFoundation.savePet')} onPress={() => void savePet()} loading={savingPet} />\n            </View>\n          ) : null}\n        </View>\n      ) : null}\n\n"""
          if delivery_needle not in s:
              raise SystemExit('Profile delivery section not found')
          s = s.replace(delivery_needle, pets_ui + delivery_needle, 1)

          style_needle = "  inline: { flexDirection: 'row', gap: spacing.x2 },\n  languages: { gap: spacing.x2 },\n"
          pet_styles = """  inline: { flexDirection: 'row', gap: spacing.x2 },\n  petGrid: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.x3 },\n  petCard: { width: '47%', minHeight: 132, borderWidth: StyleSheet.hairlineWidth, borderRadius: radii.card, padding: spacing.x4, alignItems: 'center', justifyContent: 'center', gap: spacing.x2 },\n  petAvatar: { width: 64, height: 64, borderRadius: 32, alignItems: 'center', justifyContent: 'center' },\n  petName: { ...typography.label, textAlign: 'center' },\n  petForm: { borderWidth: StyleSheet.hairlineWidth, borderRadius: radii.card, padding: spacing.x4, gap: spacing.x3 },\n  speciesRow: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.x2 },\n  speciesChip: { minHeight: touchTarget, minWidth: 84, borderWidth: 1, borderRadius: radii.compact, paddingHorizontal: spacing.x3, alignItems: 'center', justifyContent: 'center' },\n  languages: { gap: spacing.x2 },\n"""
          if style_needle not in s:
              raise SystemExit('Profile style boundary not found')
          s = s.replace(style_needle, pet_styles, 1)
          profile.write_text(s)

          translations = {
              's10-en.json': {
                  'myPets':'My Pets','addPet':'Add Pet','petName':'Pet name','petNamePlaceholder':'Pet name','dog':'Dog','cat':'Cat','other':'Other','breedOptional':'Breed (optional)','dateOfBirthOptional':'Date of birth (optional, YYYY-MM-DD)','savePet':'Save pet','petSaved':'Pet profile saved.','petRequired':'Enter a pet name and choose a species.','petsEmpty':'No pet profiles yet','petsEmptyMessage':'Add a pet to use it for grooming and veterinary bookings.','petsLoadError':'Pet profiles could not be loaded.'
              },
              's10-hi.json': {
                  'myPets':'मेरे पालतू','addPet':'पालतू जोड़ें','petName':'पालतू का नाम','petNamePlaceholder':'पालतू का नाम','dog':'कुत्ता','cat':'बिल्ली','other':'अन्य','breedOptional':'नस्ल (वैकल्पिक)','dateOfBirthOptional':'जन्म तिथि (वैकल्पिक, YYYY-MM-DD)','savePet':'पालतू सेव करें','petSaved':'पालतू प्रोफ़ाइल सेव हो गई।','petRequired':'पालतू का नाम दर्ज करें और प्रजाति चुनें।','petsEmpty':'अभी कोई पालतू प्रोफ़ाइल नहीं','petsEmptyMessage':'ग्रूमिंग और पशु-चिकित्सा बुकिंग के लिए पालतू जोड़ें।','petsLoadError':'पालतू प्रोफ़ाइल लोड नहीं हुईं।'
              },
              'te.json': {
                  'myPets':'నా పెంపుడు జంతువులు','addPet':'పెంపుడు జంతువును జోడించండి','petName':'పెంపుడు జంతువు పేరు','petNamePlaceholder':'పెంపుడు జంతువు పేరు','dog':'కుక్క','cat':'పిల్లి','other':'ఇతర','breedOptional':'బ్రీడ్ (ఐచ్ఛికం)','dateOfBirthOptional':'పుట్టిన తేదీ (ఐచ్ఛికం, YYYY-MM-DD)','savePet':'పెంపుడు జంతువును సేవ్ చేయండి','petSaved':'పెంపుడు జంతువు ప్రొఫైల్ సేవ్ అయింది.','petRequired':'పేరు నమోదు చేసి రకాన్ని ఎంచుకోండి.','petsEmpty':'ఇంకా పెంపుడు జంతువు ప్రొఫైల్స్ లేవు','petsEmptyMessage':'గ్రూమింగ్ మరియు వెటర్నరీ బుకింగ్స్ కోసం పెంపుడు జంతువును జోడించండి.','petsLoadError':'పెంపుడు జంతువు ప్రొఫైల్స్ లోడ్ కాలేదు.'
              },
          }
          i18n_root = Path('apps/customer-app/src/i18n')
          for filename, values in translations.items():
              path = i18n_root / filename
              data = json.loads(path.read_text())
              profile_foundation = data['profileFoundation']
              rebuilt = {}
              for key, value in profile_foundation.items():
                  rebuilt[key] = value
                  if key == 'account':
                      rebuilt.update(values)
              for key, value in values.items():
                  rebuilt.setdefault(key, value)
              data['profileFoundation'] = rebuilt
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          test_path = Path('apps/customer-app/src/__tests__/customer-screen-layout.test.ts')
          test_source = test_path.read_text()
          test_needle = """  test('grooming filters are horizontally scrollable', () => {\n    const source = read('app/grooming/index.tsx');\n    expect(source).toContain('horizontal');\n    expect(source).toContain('showsHorizontalScrollIndicator={false}');\n  });\n"""
          test_addition = test_needle + """\n  test('profile exposes API-backed pet management', () => {\n    const source = read('screens/profile-screen.tsx');\n    expect(source).toContain('fetchCustomerPets');\n    expect(source).toContain('createCustomerPet');\n    expect(source).toContain(\"profileFoundation.myPets\");\n    expect(source).toContain(\"profileFoundation.addPet\");\n  });\n"""
          if test_needle not in test_source:
              raise SystemExit('Customer layout test boundary not found')
          test_path.write_text(test_source.replace(test_needle, test_addition, 1))
          PY

          rm -f .github/workflows/apply-stitch-pet-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            apps/customer-app/src/screens/profile-screen.tsx \
            apps/customer-app/src/i18n/s10-en.json \
            apps/customer-app/src/i18n/s10-hi.json \
            apps/customer-app/src/i18n/te.json \
            apps/customer-app/src/__tests__/customer-screen-layout.test.ts \
            .github/workflows/apply-stitch-pet-profile.yml
          git commit -m "feat: add Stitch-guided customer pet management"
          git push origin HEAD:restore/customer-app-from-mypet
