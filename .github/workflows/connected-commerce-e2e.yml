name: connected-commerce-e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connected-commerce-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify connected E2E repository contract
        run: bash ./scripts/e2e/verify-connected-commerce-e2e.sh

      - name: Run connected Customer Merchant Captain Admin E2E
        run: ./gradlew :backend:connectedE2eTest --no-daemon --no-configuration-cache

      - name: Run independent backend and security regression baseline
        run: ./scripts/verify.sh

      - name: Verify patch whitespace
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"
