name: engineering-toolkit

on:
  pull_request:
    branches: [main]
    paths:
      - "engineering/**"
      - "scripts/verify-engineering-toolkit.sh"
      - ".github/workflows/engineering-toolkit.yml"
  push:
    branches: [main]
    paths:
      - "engineering/**"
      - "scripts/verify-engineering-toolkit.sh"
      - ".github/workflows/engineering-toolkit.yml"

permissions:
  contents: read

concurrency:
  group: engineering-toolkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify engineering-agent foundation
        env:
          HOME: ${{ runner.temp }}/engineering-toolkit-home
          npm_config_cache: ${{ runner.temp }}/engineering-toolkit-npm-cache
        shell: bash
        run: |
          mkdir -p "$HOME" "$npm_config_cache"
          ./scripts/verify-engineering-toolkit.sh

      - name: Upload deterministic contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-toolkit-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            evidence/generated/engineering-toolkit-ci/autonomous-engineering-foundation.contract.json
            evidence/generated/engineering-toolkit-ci/merchant-barcode-pos.contract.json
