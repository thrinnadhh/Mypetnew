name: import-customer-app

on:
  push:
    branches:
      - restore/customer-app-from-mypet

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/customer-app-from-mypet
          fetch-depth: 0

      - name: Import MyPet customer app only
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail --retry 3 \
            https://github.com/thrinnadhh/MyPet/archive/refs/heads/main.tar.gz \
            -o /tmp/mypet-main.tar.gz

          mkdir -p /tmp/mypet-source
          tar -xzf /tmp/mypet-main.tar.gz -C /tmp/mypet-source
          source_root="$(find /tmp/mypet-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          test -n "$source_root"
          test -d "$source_root/apps/customer-app"

          rm -rf apps/customer-app
          mkdir -p apps
          cp -R "$source_root/apps/customer-app" apps/customer-app

          test -f apps/customer-app/package.json
          test -d apps/customer-app/src

          # The importer is intentionally self-removing so the final branch contains
          # only the restored Customer app, not a permanent cross-repository sync job.
          rm -f .github/workflows/import-customer-app.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/customer-app .github/workflows/import-customer-app.yml

          if git diff --cached --quiet; then
            echo "No Customer app changes to import."
            exit 0
          fi

          git commit -m "feat: restore customer app from MyPet"
          git push origin HEAD:restore/customer-app-from-mypet
