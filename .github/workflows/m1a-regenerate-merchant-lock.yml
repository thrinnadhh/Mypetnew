name: m1a-regenerate-merchant-lock

on:
  push:
    branches:
      - m1a-merchant-foundation-auth
    paths:
      - .github/workflows/m1a-regenerate-merchant-lock.yml
      - apps/merchant-app/package.json

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate clean Merchant lockfile
        working-directory: apps/merchant-app
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.name!=='merchant-app'||p.packages?.['']?.name!=='merchant-app') process.exit(1)"
      - name: Commit generated Merchant lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/merchant-app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix M1A clean merchant dependency lock"
            git push origin HEAD:m1a-merchant-foundation-auth
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: m1a-clean-merchant-lock-${{ github.sha }}
          path: apps/merchant-app/package-lock.json
          if-no-files-found: error
      - name: Record production dependency audit
        working-directory: apps/merchant-app
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
