name: m4-refresh-merchant-lock

on:
  push:
    branches:
      - fix/m4-media-final-certification
    paths:
      - apps/merchant-app/package.json
      - .github/workflows/m4-refresh-merchant-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m4-media-final-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/merchant-app/package-lock.json
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "M4: refresh merchant lockfile"
          git push origin HEAD:fix/m4-media-final-certification
