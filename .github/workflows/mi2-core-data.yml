name: mi2-core-data

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mi2-core-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify MI-2 repository boundaries
        run: bash ./scripts/supabase/verify-mi2-core-data.sh
      - name: Certify real PostgreSQL Merchant Operations
        run: ./gradlew :backend:merchantOpsPostgresTest --no-daemon --no-configuration-cache
      - name: Certify PostgreSQL concurrency invariants
        run: ./gradlew :backend:merchantOpsConcurrencyTest --no-daemon --no-configuration-cache
      - name: Verify backend/security baseline
        run: ./scripts/verify.sh
      - name: Verify patch whitespace
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"
