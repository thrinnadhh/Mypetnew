name: mi3-async-infrastructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mi3-async-${{ github.ref }}
  cancel-in-progress: true

jobs:
  async-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify MI-3 queue authority boundaries
        run: bash ./scripts/supabase/verify-mi3-async-infrastructure.sh
      - name: Prove async constraints on real PostgreSQL
        run: ./gradlew :backend:merchantOpsPostgresTest --no-daemon --no-configuration-cache
      - name: Run backend regression and security baseline
        run: ./scripts/verify.sh
      - name: Verify patch whitespace
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"
