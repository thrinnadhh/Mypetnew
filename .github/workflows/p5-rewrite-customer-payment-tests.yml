name: p5-rewrite-customer-payment-tests

on:
  push:
    branches:
      - recovery/p5-codex-wip-20260815

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/p5-codex-wip-20260815
      - name: Replace legacy Customer payment tests with Plan 5 contract
        run: python scripts/p5_rewrite_customer_payment_tests.py
      - name: Commit test migration if changed
        run: |
          if git diff --quiet -- apps/customer-app/src/services/__tests__/high-risk-customer-services.test.ts; then
            echo 'Payment tests already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/customer-app/src/services/__tests__/high-risk-customer-services.test.ts
          git commit -m 'test(customer): certify canonical Plan 5 payment flow'
          git push origin HEAD:recovery/p5-codex-wip-20260815
