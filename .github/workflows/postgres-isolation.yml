name: postgres-isolation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: mypet_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: mypet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mypet_ci -d mypet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: mypet_ci
      PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      PGDATABASE: mypet_ci
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/mypet_ci
      DATABASE_USERNAME: mypet_ci
      DATABASE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_PORT: '18080'
      MYPET_TOKEN_ISSUER: mypetnew-ci
      MYPET_TOKEN_AUDIENCE: mypetnew-ci
      MYPET_ENVIRONMENT: development
      FIREBASE_PROJECT_ID: mypetnew-ci
      NOTIFICATION_DELIVERY_ENABLED: 'false'
      CASHFREE_ENABLED: 'false'
      SUPABASE_URL: https://isolated.mypet.local
      SUPABASE_SERVICE_ROLE_KEY: isolated-ci-service-role-key-32-chars-minimum
      SUPABASE_PRIVATE_EVIDENCE_BUCKET: provider-verification-private
      SUPABASE_CATALOG_MEDIA_BUCKET: catalog-media
      MANAGEMENT_HEALTH_REDIS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generate isolated runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          sync_secret="$(openssl rand -hex 32)"
          token_secret="$(openssl rand -hex 32)"
          device_key="$(openssl rand -base64 32 | tr -d '\n')"
          printf '::add-mask::%s\n' "$sync_secret" "$token_secret" "$device_key"
          {
            echo "MYPET_SYNC_CURSOR_SECRET=$sync_secret"
            echo "MYPET_TOKEN_SECRET=$token_secret"
            echo "MYPET_DEVICE_TOKEN_KEY=$device_key"
          } >> "$GITHUB_ENV"

      - name: Verify repository database boundaries
        run: |
          bash ./scripts/supabase/verify-repository-migrations.sh
          bash ./scripts/supabase/verify-feature-boundaries.sh
          bash -n ./scripts/postgres/verify-ephemeral-db.sh
          bash -n ./scripts/dev/isolated-postgres-env.sh
          bash -n ./scripts/postgres/test-isolation-adversarial.sh
          bash ./scripts/postgres/test-isolation-adversarial.sh

      - name: Prove database starts empty
        run: bash ./scripts/postgres/verify-ephemeral-db.sh preflight

      - name: Align PostGIS extension layout with Supabase
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DROP EXTENSION IF EXISTS postgis_topology CASCADE;
          DROP EXTENSION IF EXISTS postgis CASCADE;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION postgis WITH SCHEMA extensions;
          SQL
          namespace="$(psql -A -t -v ON_ERROR_STOP=1 -c "
            SELECT n.nspname
            FROM pg_extension e
            JOIN pg_namespace n ON n.oid = e.extnamespace
            WHERE e.extname = 'postgis';
          ")"
          [[ "$namespace" == extensions ]] || {
            echo "PostGIS extension namespace is '$namespace', expected 'extensions'." >&2
            exit 1
          }

      - name: Compile backend before runtime deadline
        run: ./gradlew :backend:classes --no-daemon --no-configuration-cache

      - name: Boot exact backend against fresh PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mypet-backend.log"
          ./gradlew :backend:bootRun --no-daemon --no-configuration-cache >"$log_file" 2>&1 &
          backend_pid=$!
          cleanup() {
            kill -TERM "$backend_pid" 2>/dev/null || true
            wait "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          healthy=false
          for attempt in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${SERVER_PORT}/actuator/health" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "Backend exited during fresh-database startup." >&2
              tail -n 180 "$log_file" >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$healthy" != true ]]; then
            echo "Backend did not become healthy after compilation completed." >&2
            tail -n 180 "$log_file" >&2 || true
            exit 1
          fi
          curl -fsS "http://127.0.0.1:${SERVER_PORT}/actuator/health" | grep -q '"status":"UP"'

      - name: Verify Flyway and data isolation after runtime migration
        run: bash ./scripts/postgres/verify-ephemeral-db.sh postflight

      - name: Run real PostgreSQL Merchant Operations contracts
        run: >-
          ./gradlew
          :backend:merchantOpsPostgresTest
          :backend:merchantOpsConcurrencyTest
          --no-daemon
          --no-configuration-cache

      - name: Verify patch whitespace
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"

      - name: Record non-secret isolation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/evidence/postgres-isolation
          {
            echo "git_sha=$GITHUB_SHA"
            echo "postgres=17"
            echo "postgis=3.5"
            echo "postgis_schema=extensions"
            echo "database=fresh-ephemeral"
            echo "supabase_staging_used=false"
          } > build/evidence/postgres-isolation/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-isolation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/evidence/postgres-isolation
            backend/build/reports/tests/merchantOpsPostgresTest
            backend/build/reports/tests/merchantOpsConcurrencyTest
