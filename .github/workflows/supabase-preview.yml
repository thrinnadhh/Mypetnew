name: supabase-preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      head_ref:
        description: Git branch whose Supabase preview environment should be certified
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-preview-${{ github.event.pull_request.number || inputs.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preview-database:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.SUPABASE_PREVIEW_ENABLED == 'true' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PARENT_PROJECT_REF: gxxmbmcezyuqwywblzlh
      HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
      FLYWAY_IMAGE: flyway/flyway:12.4.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Validate preview CI configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Repository secret SUPABASE_ACCESS_TOKEN is required." >&2
            exit 2
          fi
          if [[ -z "$HEAD_REF" ]]; then
            echo "Git head ref is required." >&2
            exit 2
          fi
          bash ./scripts/supabase/verify-repository-migrations.sh
          bash ./scripts/supabase/verify-feature-boundaries.sh
          bash -n ./scripts/supabase/migrate-preview-branch.sh
          bash -n ./scripts/supabase/verify-preview-isolation.sh
          node --test ./scripts/supabase/prepare-preview-branch-env.test.mjs

      - name: Wait for Supabase preview branch
        shell: bash
        run: |
          set -euo pipefail
          branch_env="$RUNNER_TEMP/supabase-preview.env"
          error_log="$RUNNER_TEMP/supabase-preview-error.log"
          found=false
          for attempt in $(seq 1 20); do
            if supabase branches get "$HEAD_REF" \
              --project-ref "$SUPABASE_PARENT_PROJECT_REF" \
              -o env >"$branch_env" 2>"$error_log"; then
              found=true
              break
            fi
            echo "Preview branch is not healthy yet (attempt $attempt/20)."
            sleep 15
          done
          if [[ "$found" != true ]]; then
            echo "Supabase preview branch for '$HEAD_REF' was not available." >&2
            echo "Enable GitHub Integration + Automatic Branching for the PetShop project." >&2
            cat "$error_log" >&2 || true
            exit 1
          fi
          node ./scripts/supabase/prepare-preview-branch-env.mjs "$branch_env"
          rm -f "$branch_env" "$error_log"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply canonical Flyway migrations to preview
        run: bash ./scripts/supabase/migrate-preview-branch.sh

      - name: Verify preview Flyway drift
        env:
          SUPABASE_DATABASE_URL: ${{ env.PREVIEW_DATABASE_URL }}
        run: bash ./scripts/supabase/verify-live-drift.sh

      - name: Verify preview contains no production data
        run: bash ./scripts/supabase/verify-preview-isolation.sh

      - name: Record preview database evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/supabase-preview
          {
            echo "head_ref=$HEAD_REF"
            echo "preview_project_ref=$PREVIEW_PROJECT_REF"
            echo "parent_project_ref=$SUPABASE_PARENT_PROJECT_REF"
            echo "git_sha=$GITHUB_SHA"
            echo "flyway_image=$FLYWAY_IMAGE"
          } > build/evidence/supabase-preview/summary.txt
          psql "$PREVIEW_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT 'flyway_latest=' || COALESCE(MAX(version::integer), 0)
            FROM mypet.flyway_schema_history
            WHERE success AND version ~ '^[0-9]+$';
          " >> build/evidence/supabase-preview/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-preview-${{ github.sha }}
          if-no-files-found: warn
          path: build/evidence/supabase-preview
