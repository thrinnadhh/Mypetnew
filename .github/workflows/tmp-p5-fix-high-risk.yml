name: tmp-p5-fix-high-risk

on:
  push:
    branches:
      - recovery/p5-codex-wip-20260815
    paths:
      - .github/workflows/tmp-p5-fix-high-risk.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/p5-codex-wip-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite stale high-risk payment assertions
        run: python scripts/tmp_p5_fix_high_risk_customer_test.py
      - name: Commit migrated test only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer-app/src/services/__tests__/high-risk-customer-services.test.ts
          git diff --cached --check
          git commit -m "test(customer): migrate high-risk payment assertions to Plan 5"
          git push origin HEAD:recovery/p5-codex-wip-20260815
