name: tmp-p5-fix-quote-authority

on:
  push:
    branches:
      - recovery/p5-codex-wip-20260815
    paths:
      - .github/workflows/tmp-p5-fix-quote-authority.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/p5-codex-wip-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Narrow quote authority source assertion
        run: python scripts/tmp_p5_fix_quote_authority_test.py
      - name: Commit migrated assertion only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer-app/src/__tests__/customer-journey-contracts.test.ts
          git diff --cached --check
          git commit -m "test(customer): scope quote authority assertion to request bodies"
          git push origin HEAD:recovery/p5-codex-wip-20260815
