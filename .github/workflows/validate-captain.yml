name: validate-captain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/captain-*", "feat/captain-*", "trial/*", "infra/supabase-hardening-*"]

permissions:
  contents: read

jobs:
  captain-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/captain-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/captain-app/package-lock.json
      - name: Install Captain dependencies
        run: npm ci --no-audit --no-fund
      - name: Guard Captain production dependency advisories
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const allowed = new Set([
            'https://github.com/advisories/GHSA-w3rx-r6r6-pgpr',
            'https://github.com/advisories/GHSA-5p2g-fcmc-qvqq',
            'https://github.com/advisories/GHSA-vcc3-ghjq-m6fr',
          ]);
          const urls = new Set();
          for (const vulnerability of Object.values(report.vulnerabilities || {})) {
            for (const via of vulnerability.via || []) {
              if (via && typeof via === 'object' && typeof via.url === 'string') urls.add(via.url);
            }
          }
          const meta = report.metadata?.vulnerabilities || {};
          const critical = Number(meta.critical || 0);
          const high = Number(meta.high || 0);
          const unexpected = [...urls].filter((url) => !allowed.has(url));
          if (critical > 0 || unexpected.length > 0 || (high > 0 && urls.size === 0)) {
            console.error(JSON.stringify({ critical, high, advisoryUrls: [...urls], unexpected }, null, 2));
            process.exit(1);
          }
          console.log('Captain production dependency advisory gate passed.');
          NODE
          rm -f audit.json

      - name: Typecheck Captain app
        run: npm run typecheck
      - name: Lint Captain app
        run: npm run lint
      - name: Test Captain app
        run: npm test
      - name: Guard Captain architecture boundaries
        run: npm run test:architecture
      - name: Export Captain Android bundle
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://api.invalid.example
        run: npx expo export --platform android --output-dir /tmp/captain-android-export
      - name: Export Captain web bundle
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://api.invalid.example
        run: npx expo export --platform web --output-dir dist-ci
      - name: Upload Captain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captain-test-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            apps/captain-app/coverage
