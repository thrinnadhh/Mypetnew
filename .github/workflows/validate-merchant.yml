name: validate-merchant

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "trial/*", "m1a-*", "m1b-*", "m1c-*", "m1d-*", "m1e-*", "infra/supabase-hardening-*"]

permissions:
  contents: read

jobs:
  merchant-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/merchant-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/merchant-app/package-lock.json
      - name: Install Merchant dependencies
        run: npm ci --no-audit --no-fund
      - name: Guard Merchant production dependency advisories
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const allowed = new Set([
            'https://github.com/advisories/GHSA-w3rx-r6r6-pgpr',
            'https://github.com/advisories/GHSA-5p2g-fcmc-qvqq',
          ]);
          const urls = new Set();
          for (const vulnerability of Object.values(report.vulnerabilities || {})) {
            for (const via of vulnerability.via || []) {
              if (via && typeof via === 'object' && typeof via.url === 'string') urls.add(via.url);
            }
          }
          const meta = report.metadata?.vulnerabilities || {};
          const critical = Number(meta.critical || 0);
          const high = Number(meta.high || 0);
          const unexpected = [...urls].filter((url) => !allowed.has(url));
          if (critical > 0 || unexpected.length > 0 || (high > 0 && urls.size === 0)) {
            console.error(JSON.stringify({ critical, high, advisoryUrls: [...urls], unexpected }, null, 2));
            process.exit(1);
          }
          if (high > 0) {
            console.warn(`${high} transitive High findings trace only to the two documented, currently unpatched image-size Metro build-tool advisories.`);
          }
          console.log('Merchant production dependency advisory gate passed.');
          NODE
          rm -f audit.json
      - name: Verify Merchant route hygiene
        run: |
          node ../../scripts/merchant-app/verify-route-hygiene.mjs
          node --test ../../scripts/merchant-app/verify-route-hygiene.test.mjs
      - name: Typecheck Merchant app
        run: npm run typecheck
      - name: Lint Merchant app
        run: npm run lint
      - name: Test Merchant app
        run: npm run test:ci
      - name: Export Merchant Android bundle
        run: npx expo export --platform android --output-dir /tmp/merchant-android-export
      - name: Export Merchant production web bundle
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.invalid.example
        run: npx expo export --platform web --output-dir dist-ci
      - name: Upload Merchant test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-test-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            apps/merchant-app/coverage
