name: validate-restored-customer

on:
  pull_request:
    branches:
      - main
      - trial/s1-recovery-certification
      - restore/customer-app-from-mypet
      - "trial/*"
  push:
    branches:
      - main
      - restore/customer-app-from-mypet
      - "trial/*"

permissions:
  contents: read

jobs:
  customer-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/customer-app/package-lock.json
      - name: Install Customer dependencies
        run: npm ci --no-audit --no-fund
      - name: Guard Customer production dependency advisories
        run: node ./scripts/check-dependency-audit.mjs
      - name: Guard Customer network architecture
        run: npm run check:network-boundaries
      - name: Typecheck Customer app
        run: npm run typecheck
      - name: Lint Customer app
        run: npm run lint
      - name: Test Merchant-to-Customer consistency contracts
        run: npm run test:merchant-consistency
      - name: Test Customer app
        run: npm test -- --runInBand
      - name: Enforce high-risk module coverage gates
        run: |
          npx jest --runInBand --coverage --coverageReporters=json-summary
          node ./scripts/check-production-coverage.cjs
      - name: Export Android Customer bundle
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://api.invalid.example
        run: npx expo export -p android --output-dir dist-android
      - name: Export Customer web bundle
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://api.invalid.example
        run: npx expo export -p web --output-dir dist-web
      - name: Guard Customer web bundle excludes Cashfree native SDK
        run: |
          test -d dist-web || { echo "dist-web export output not found"; exit 1; }
          if grep -rn "react-native-cashfree-pg-sdk" dist-web; then
            echo "Cashfree native SDK leaked into the Customer web bundle."
            exit 1
          fi
          echo "Customer web bundle excludes the Cashfree native SDK."
      - name: Upload Customer Android export bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-android-export-${{ github.sha }}
          if-no-files-found: warn
          path: apps/customer-app/dist-android
      - name: Upload Customer web export bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-web-export-${{ github.sha }}
          if-no-files-found: warn
          path: apps/customer-app/dist-web
