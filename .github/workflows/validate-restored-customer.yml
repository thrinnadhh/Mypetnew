name: validate-restored-customer

on:
  pull_request:
    branches:
      - main
      - trial/s1-recovery-certification
      - restore/customer-app-from-mypet
      - "trial/*"
  push:
    branches:
      - main
      - restore/customer-app-from-mypet
      - "trial/*"

permissions:
  contents: read

jobs:
  customer-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/customer-app/package-lock.json
      - name: Install Customer dependencies
        run: npm ci
      - name: Typecheck Customer app
        run: npm run typecheck
      - name: Lint Customer app
        run: npm run lint
      - name: Test Customer app
        run: npm test -- --runInBand
