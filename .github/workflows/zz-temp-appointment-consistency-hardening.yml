name: temporary-appointment-consistency-hardening

on:
  push:
    branches:
      - feat/customer-canonical-appointments-20260816

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-canonical-appointments-20260816
          fetch-depth: 0
      - name: Harden appointment consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker missing: {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          domain = 'backend/src/main/kotlin/in/mypetnew/appointment/domain/AppointmentService.kt'
          replace_once(
              domain,
              '''    @Synchronized override fun confirm(customerId: UUID, appointmentId: UUID, now: Instant): CustomerAppointment? {
        expireHolds(now)
        val current = appointments[appointmentId]?.takeIf { it.customerId == customerId } ?: return null
        if (current.status == AppointmentStatus.BOOKED || current.status == AppointmentStatus.CONFIRMED) return current
        if (current.status != AppointmentStatus.HOLD) invalidState()
        if (current.holdExpiresAt == null || !current.holdExpiresAt.isAfter(now)) holdExpired()
        return current.copy(status = AppointmentStatus.BOOKED, holdExpiresAt = null, updatedAt = now)
            .also { appointments[appointmentId] = it }
    }

    @Synchronized override fun cancel(customerId: UUID, appointmentId: UUID, reason: String?, now: Instant): CustomerAppointment? {
        expireHolds(now)
        val current = appointments[appointmentId]?.takeIf { it.customerId == customerId } ?: return null
        if (current.status == AppointmentStatus.CANCELLED) return current
        if (current.status !in setOf(AppointmentStatus.HOLD, AppointmentStatus.BOOKED, AppointmentStatus.CONFIRMED)) invalidState()
        return current.copy(status = AppointmentStatus.CANCELLED, notes = reason?.trim()?.takeIf { it.isNotEmpty() } ?: current.notes, holdExpiresAt = null, updatedAt = now)
            .also { appointments[appointmentId] = it }
    }''',
              '''    @Synchronized override fun confirm(customerId: UUID, appointmentId: UUID, now: Instant): CustomerAppointment? {
        val current = appointments[appointmentId]?.takeIf { it.customerId == customerId } ?: return null
        if (current.status == AppointmentStatus.BOOKED || current.status == AppointmentStatus.CONFIRMED) return current
        if (current.status == AppointmentStatus.HOLD_EXPIRED) holdExpired()
        if (current.status == AppointmentStatus.HOLD && (current.holdExpiresAt == null || !current.holdExpiresAt.isAfter(now))) {
            appointments[appointmentId] = current.copy(status = AppointmentStatus.HOLD_EXPIRED, updatedAt = now)
            holdExpired()
        }
        if (current.status != AppointmentStatus.HOLD) invalidState()
        return current.copy(status = AppointmentStatus.BOOKED, holdExpiresAt = null, updatedAt = now)
            .also { appointments[appointmentId] = it }
    }

    @Synchronized override fun cancel(customerId: UUID, appointmentId: UUID, reason: String?, now: Instant): CustomerAppointment? {
        val current = appointments[appointmentId]?.takeIf { it.customerId == customerId } ?: return null
        if (current.status == AppointmentStatus.CANCELLED) return current
        if (current.status == AppointmentStatus.HOLD_EXPIRED) holdExpired()
        if (current.status == AppointmentStatus.HOLD && (current.holdExpiresAt == null || !current.holdExpiresAt.isAfter(now))) {
            appointments[appointmentId] = current.copy(status = AppointmentStatus.HOLD_EXPIRED, updatedAt = now)
            holdExpired()
        }
        if (current.status !in setOf(AppointmentStatus.HOLD, AppointmentStatus.BOOKED, AppointmentStatus.CONFIRMED)) invalidState()
        return current.copy(status = AppointmentStatus.CANCELLED, notes = reason?.trim()?.takeIf { it.isNotEmpty() } ?: current.notes, holdExpiresAt = null, updatedAt = now)
            .also { appointments[appointmentId] = it }
    }''',
          )
          replace_once(
              domain,
              '''        Authorizer.requireOutlet(merchant, outletId)
        val outlet = providers.getOutlet(outletId)
        if (outlet.status != ProviderStatus.ACTIVE || !supports(outlet.capabilities, capability)) unavailable()''',
              '''        Authorizer.requireOutlet(merchant, outletId)
        val outlet = providers.getOutlet(outletId)
        if (merchant.organizationId == null || merchant.organizationId != outlet.organizationId) unavailable()
        if (outlet.status != ProviderStatus.ACTIVE || !supports(outlet.capabilities, capability)) unavailable()''',
          )
          replace_once(
              domain,
              '''        val offering = activeOffering(serviceId)
        Authorizer.requireOutlet(merchant, offering.outletId)
        val now = clock.instant()''',
              '''        val offering = activeOffering(serviceId)
        Authorizer.requireOutlet(merchant, offering.outletId)
        if (merchant.organizationId == null || merchant.organizationId != offering.organizationId) unavailable()
        val now = clock.instant()''',
          )
          replace_once(
              domain,
              '''        Authorizer.requireRole(merchant, Role.MERCHANT)
        Authorizer.requireOutlet(merchant, outletId)
        val allowedFrom = when (target) {''',
              '''        Authorizer.requireRole(merchant, Role.MERCHANT)
        Authorizer.requireOutlet(merchant, outletId)
        val outlet = providers.getOutlet(outletId)
        if (merchant.organizationId == null || merchant.organizationId != outlet.organizationId) unavailable()
        val allowedFrom = when (target) {''',
          )

          jdbc = 'backend/src/main/kotlin/in/mypetnew/appointment/infrastructure/JdbcAppointmentPersistence.kt'
          replace_once(
              jdbc,
              '''        if (current.status == AppointmentStatus.BOOKED || current.status == AppointmentStatus.CONFIRMED) return@execute current
        if (current.status != AppointmentStatus.HOLD) invalidState()
        if (current.holdExpiresAt == null || !current.holdExpiresAt.isAfter(now)) holdExpired()''',
              '''        if (current.status == AppointmentStatus.BOOKED || current.status == AppointmentStatus.CONFIRMED) return@execute current
        if (current.status == AppointmentStatus.HOLD_EXPIRED) holdExpired()
        if (current.status != AppointmentStatus.HOLD) invalidState()
        if (current.holdExpiresAt == null || !current.holdExpiresAt.isAfter(now)) holdExpired()''',
          )
          replace_once(
              jdbc,
              '''        if (current.status == AppointmentStatus.CANCELLED) return@execute current
        if (current.status !in setOf(AppointmentStatus.HOLD, AppointmentStatus.BOOKED, AppointmentStatus.CONFIRMED)) invalidState()''',
              '''        if (current.status == AppointmentStatus.CANCELLED) return@execute current
        if (current.status == AppointmentStatus.HOLD_EXPIRED) holdExpired()
        if (current.status == AppointmentStatus.HOLD && (current.holdExpiresAt == null || !current.holdExpiresAt.isAfter(now))) holdExpired()
        if (current.status !in setOf(AppointmentStatus.HOLD, AppointmentStatus.BOOKED, AppointmentStatus.CONFIRMED)) invalidState()''',
          )

          test = 'backend/src/test/kotlin/in/mypetnew/appointment/AppointmentServiceTest.kt'
          replace_once(
              test,
              'assertEquals("APPOINTMENT_STATE_INVALID", error.code)',
              'assertEquals("APPOINTMENT_HOLD_EXPIRED", error.code)',
          )
          replace_once(
              test,
              '''        assertEquals(AppointmentStatus.HOLD_EXPIRED, later.get(customerA, held.id).status)
        assertEquals(listOf(slot.id), later.availability(offering.id, now, now.plusSeconds(86_400)).map { it.id })''',
              '''        assertEquals(AppointmentStatus.HOLD_EXPIRED, later.get(customerA, held.id).status)
        val cancelError = assertThrows(DomainException::class.java) { later.cancel(customerA, held.id, "Too late") }
        assertEquals("APPOINTMENT_HOLD_EXPIRED", cancelError.code)
        assertEquals(listOf(slot.id), later.availability(offering.id, now, now.plusSeconds(86_400)).map { it.id })''',
          )
          PY
      - name: Commit hardening and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/zz-temp-appointment-consistency-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(appointments): align expiry and tenant isolation"
          git push origin HEAD:feat/customer-canonical-appointments-20260816
