name: temporary-appointment-lifecycle-migration

on:
  push:
    branches:
      - feat/customer-canonical-appointments-20260816

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-canonical-appointments-20260816
          fetch-depth: 0
      - name: Add atomic merchant appointment lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          domain = 'backend/src/main/kotlin/in/mypetnew/appointment/domain/AppointmentService.kt'
          replace_once(
              domain,
              '    fun cancel(customerId: UUID, appointmentId: UUID, reason: String?, now: Instant): CustomerAppointment?\n    fun get(customerId: UUID, appointmentId: UUID, now: Instant): CustomerAppointment?',
              '''    fun cancel(customerId: UUID, appointmentId: UUID, reason: String?, now: Instant): CustomerAppointment?\n    fun merchantTransition(\n        outletId: UUID,\n        appointmentId: UUID,\n        allowedFrom: Set<AppointmentStatus>,\n        target: AppointmentStatus,\n        actorId: UUID,\n        now: Instant,\n    ): CustomerAppointment?\n    fun get(customerId: UUID, appointmentId: UUID, now: Instant): CustomerAppointment?''',
          )
          replace_once(
              domain,
              '    @Synchronized override fun get(customerId: UUID, appointmentId: UUID, now: Instant): CustomerAppointment? {',
              '''    @Synchronized override fun merchantTransition(\n        outletId: UUID,\n        appointmentId: UUID,\n        allowedFrom: Set<AppointmentStatus>,\n        target: AppointmentStatus,\n        actorId: UUID,\n        now: Instant,\n    ): CustomerAppointment? {\n        expireHolds(now)\n        val current = appointments[appointmentId]?.takeIf { it.outletId == outletId } ?: return null\n        if (current.status == target) return current\n        if (current.status !in allowedFrom) invalidState()\n        return current.copy(status = target, holdExpiresAt = null, updatedAt = now)\n            .also { appointments[appointmentId] = it }\n    }\n\n    @Synchronized override fun get(customerId: UUID, appointmentId: UUID, now: Instant): CustomerAppointment? {''',
          )
          replace_once(
              domain,
              '    fun get(customer: Principal, appointmentId: UUID): CustomerAppointment {',
              '''    fun merchantTransition(\n        merchant: Principal,\n        outletId: UUID,\n        appointmentId: UUID,\n        target: AppointmentStatus,\n    ): CustomerAppointment {\n        Authorizer.requireRole(merchant, Role.MERCHANT)\n        Authorizer.requireOutlet(merchant, outletId)\n        val allowedFrom = when (target) {\n            AppointmentStatus.CONFIRMED -> setOf(AppointmentStatus.BOOKED)\n            AppointmentStatus.REJECTED -> setOf(AppointmentStatus.BOOKED)\n            AppointmentStatus.CHECKED_IN -> setOf(AppointmentStatus.CONFIRMED)\n            AppointmentStatus.IN_SERVICE -> setOf(AppointmentStatus.CHECKED_IN)\n            AppointmentStatus.COMPLETED -> setOf(AppointmentStatus.IN_SERVICE)\n            AppointmentStatus.NO_SHOW -> setOf(AppointmentStatus.BOOKED, AppointmentStatus.CONFIRMED)\n            AppointmentStatus.CANCELLED -> setOf(AppointmentStatus.BOOKED, AppointmentStatus.CONFIRMED)\n            else -> throw DomainException("APPOINTMENT_STATUS_TARGET_INVALID", "The requested merchant appointment status is not allowed")\n        }\n        return persistence.merchantTransition(\n            outletId, appointmentId, allowedFrom, target, merchant.actorId, clock.instant(),\n        ) ?: unavailable()\n    }\n\n    fun get(customer: Principal, appointmentId: UUID): CustomerAppointment {''',
          )

          jdbc = 'backend/src/main/kotlin/in/mypetnew/appointment/infrastructure/JdbcAppointmentPersistence.kt'
          replace_once(
              jdbc,
              '    override fun get(customerId: UUID, appointmentId: UUID, now: Instant): CustomerAppointment? {',
              '''    override fun merchantTransition(\n        outletId: UUID,\n        appointmentId: UUID,\n        allowedFrom: Set<AppointmentStatus>,\n        target: AppointmentStatus,\n        actorId: UUID,\n        now: Instant,\n    ): CustomerAppointment? = transaction.execute {\n        val current = jdbc.sql(\n            """\n            SELECT id, customer_id, pet_id, organization_id, outlet_id, service_id, slot_id,\n                   service_name, outlet_name, pet_name, starts_at, ends_at, status, payment_method,\n                   payment_status, price_paise, notes, hold_expires_at, created_at, updated_at\n            FROM mypet.appointment WHERE id = :id AND outlet_id = :outlet_id FOR UPDATE\n            """.trimIndent(),\n        ).param("id", appointmentId)\n            .param("outlet_id", outletId)\n            .query(::mapAppointment).optional().orElse(null) ?: return@execute null\n        if (current.status == target) return@execute current\n        if (current.status !in allowedFrom) invalidState()\n        jdbc.sql(\n            "UPDATE mypet.appointment SET status = :status, hold_expires_at = NULL, updated_at = :now WHERE id = :id",\n        ).param("status", target.name).param("now", now).param("id", appointmentId).update()\n        appendHistory(appointmentId, target, actorId, now, "MERCHANT_STATUS")\n        current.copy(status = target, holdExpiresAt = null, updatedAt = now)\n    }\n\n    override fun get(customerId: UUID, appointmentId: UUID, now: Instant): CustomerAppointment? {''',
          )

          controller = 'backend/src/main/kotlin/in/mypetnew/application/web/AppointmentControllers.kt'
          replace_once(
              controller,
              'data class MerchantServiceSlotRequest(val startsAt: Instant)\n',
              '''data class MerchantServiceSlotRequest(val startsAt: Instant)\ndata class MerchantAppointmentStatusRequest(val outletId: UUID, val status: AppointmentStatus)\n''',
          )
          replace_once(
              controller,
              '@RestController\n@RequestMapping("/api/v1/customer/appointments")\nclass CustomerAppointmentApiController',
              '''@RestController\n@RequestMapping("/api/v1/merchant/appointments")\nclass MerchantAppointmentApiController(private val appointments: AppointmentService) {\n    @PostMapping("/{appointmentId}/status")\n    fun transition(\n        authentication: Authentication,\n        @PathVariable appointmentId: UUID,\n        @RequestBody request: MerchantAppointmentStatusRequest,\n    ): CustomerAppointmentResponse = appointmentResponse(\n        appointments.merchantTransition(merchant(authentication), request.outletId, appointmentId, request.status),\n    )\n}\n\n@RestController\n@RequestMapping("/api/v1/customer/appointments")\nclass CustomerAppointmentApiController''',
          )
          PY
      - name: Commit lifecycle and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/zz-temp-appointment-lifecycle-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(appointments): implement merchant lifecycle transitions"
          git push origin HEAD:feat/customer-canonical-appointments-20260816
