name: temporary-idempotent-rebook-fix

on:
  push:
    branches:
      - feat/customer-canonical-appointments-20260816

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-canonical-appointments-20260816
          fetch-depth: 0
      - name: Patch retry and rebooking semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          domain = 'backend/src/main/kotlin/in/mypetnew/appointment/domain/AppointmentService.kt'
          replace_once(
              domain,
              '''    ): CustomerAppointment = holds.execute("appointment:${appointment.customerId}", idempotencyKey, requestFingerprint) {
        expireHolds(now)
        if (appointments.values.any { it.slotId == appointment.slotId && it.status in OCCUPYING_STATUSES }) slotUnavailable()
        appointment.also { appointments[it.id] = it }
    }''',
              '''    ): CustomerAppointment = holds.execute("appointment:${appointment.customerId}", idempotencyKey, requestFingerprint) {
        expireHolds(now)
        val existing = appointments.values.firstOrNull {
            it.slotId == appointment.slotId && it.status in OCCUPYING_STATUSES
        }
        if (existing != null) {
            if (
                existing.customerId == appointment.customerId &&
                existing.petId == appointment.petId &&
                existing.serviceId == appointment.serviceId
            ) {
                existing
            } else {
                slotUnavailable()
            }
        } else {
            appointment.also { appointments[it.id] = it }
        }
    }''',
          )

          jdbc = 'backend/src/main/kotlin/in/mypetnew/appointment/infrastructure/JdbcAppointmentPersistence.kt'
          replace_once(
              jdbc,
              '''                if (!slotAvailable) slotUnavailable()

                insertAppointment(appointment, idempotencyKey, requestFingerprint)''',
              '''                if (!slotAvailable) slotUnavailable()

                val existing = jdbc.sql(
                    """
                    SELECT id, customer_id, pet_id, organization_id, outlet_id, service_id, slot_id,
                           service_name, outlet_name, pet_name, starts_at, ends_at, status, payment_method,
                           payment_status, price_paise, notes, hold_expires_at, created_at, updated_at
                    FROM mypet.appointment
                    WHERE slot_id = :slot_id
                      AND (
                          status IN ('BOOKED','CONFIRMED','CHECKED_IN','IN_SERVICE')
                          OR (status = 'HOLD' AND hold_expires_at > :now)
                      )
                    FOR UPDATE
                    """.trimIndent(),
                ).param("slot_id", appointment.slotId)
                    .param("now", now)
                    .query(::mapAppointment)
                    .optional()
                    .orElse(null)
                if (existing != null) {
                    if (
                        existing.customerId == appointment.customerId &&
                        existing.petId == appointment.petId &&
                        existing.serviceId == appointment.serviceId
                    ) {
                        return@execute existing
                    }
                    slotUnavailable()
                }

                insertAppointment(appointment, idempotencyKey, requestFingerprint)''',
          )

          client = 'apps/customer-app/src/services/appointment-booking.ts'
          replace_once(
              client,
              '''  const response = await fetch(`${appConfig.apiBaseUrl}/api/v1/customer/appointments`, {
    method: 'POST',
    headers: {
      ...jsonHeaders(input.accessToken),
      'Idempotency-Key': `appointment-${input.slot.id}-${input.petId}`,
    },''',
              '''  const attemptKey = `appointment-${input.slot.id}-${input.petId}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  const response = await fetch(`${appConfig.apiBaseUrl}/api/v1/customer/appointments`, {
    method: 'POST',
    headers: {
      ...jsonHeaders(input.accessToken),
      'Idempotency-Key': attemptKey,
    },''',
          )

          # Tests must verify the stable prefix rather than a random per-attempt suffix.
          for path in [
              'apps/customer-app/src/services/__tests__/customer-connected-services.test.ts',
              'apps/customer-app/src/services/__tests__/production-service-coverage.test.ts',
          ]:
              p = Path(path)
              text = p.read_text()
              text = text.replace(
                  "'Idempotency-Key': 'appointment-55555555-5555-4555-8555-555555555555-88888888-8888-4888-8888-888888888888',",
                  "'Idempotency-Key': expect.stringMatching(/^appointment-55555555-5555-4555-8555-555555555555-88888888-8888-4888-8888-888888888888-/),",
              )
              text = text.replace(
                  "'Idempotency-Key': 'appointment-slot-1-pet-1',",
                  "'Idempotency-Key': expect.stringMatching(/^appointment-slot-1-pet-1-/),",
              )
              p.write_text(text)

          # Add domain regression coverage for a fresh retry key and post-cancel rebooking.
          test = Path('backend/src/test/kotlin/in/mypetnew/appointment/AppointmentServiceTest.kt')
          text = test.read_text()
          marker = '''        assertEquals(AppointmentStatus.CANCELLED, service.cancel(customerA, first.id, "Plans changed").status)
        assertEquals(1, service.list(customerA, 0, 20).items.size)'''
          replacement = '''        val freshKeyReplay = service.hold(
            customerA,
            outletId,
            offering.id,
            petA,
            slot.id,
            AppointmentPaymentMethod.PAY_AT_PROVIDER,
            "Sensitive paws",
            "hold-fresh-key",
        )
        assertEquals(first.id, freshKeyReplay.id, "a transport retry with a fresh key must return the active hold")

        assertEquals(AppointmentStatus.CANCELLED, service.cancel(customerA, first.id, "Plans changed").status)
        val rebooked = service.hold(
            customerA,
            outletId,
            offering.id,
            petA,
            slot.id,
            AppointmentPaymentMethod.PAY_AT_PROVIDER,
            "Booking again",
            "hold-after-cancel",
        )
        assertTrue(rebooked.id != first.id, "a genuine post-cancel booking must create a new appointment")
        assertEquals(2, service.list(customerA, 0, 20).items.size)'''
          if marker not in text:
              raise SystemExit('AppointmentServiceTest rebooking marker missing')
          test.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/zz-temp-idempotent-rebook-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(appointments): support safe retry and later rebooking"
          git push origin HEAD:feat/customer-canonical-appointments-20260816
