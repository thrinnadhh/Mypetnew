name: temporary-refresh-customer-lock

on:
  push:
    branches:
      - feat/customer-canonical-appointments-20260816

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-canonical-appointments-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh customer package lock
        working-directory: apps/customer-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove helper
        shell: bash
        run: |
          rm .github/workflows/zz-temp-refresh-customer-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer-app/package-lock.json .github/workflows/zz-temp-refresh-customer-lock.yml
          git commit -m "fix(customer): refresh nanoid dependency lockfile"
          git push origin HEAD:feat/customer-canonical-appointments-20260816
