name: temporary-regenerate-customer-lock

on:
  push:
    branches:
      - feat/customer-canonical-appointments-20260816

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-canonical-appointments-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/customer-app/package-lock.json
      - name: Regenerate Customer lockfile from compatible overrides
        working-directory: apps/customer-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lock and remove temporary workflow
        run: |
          rm .github/workflows/zz-temp-regenerate-customer-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer-app/package-lock.json .github/workflows/zz-temp-regenerate-customer-lock.yml
          git commit -m "chore(customer): refresh dependency lock security overrides"
          git push origin HEAD:feat/customer-canonical-appointments-20260816
