spring:
  application:
    name: mypetnew-backend
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX:10}
      minimum-idle: ${DATABASE_POOL_MIN:2}
      connection-timeout: 5000
  flyway:
    enabled: true
    schemas: mypet
    default-schema: mypet
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mypet:
  cors:
    allowed-origins: ${MYPET_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
  sync:
    cursor-secret: ${MYPET_SYNC_CURSOR_SECRET:}
  security:
    token-secret: ${MYPET_TOKEN_SECRET:}
    token-issuer: ${MYPET_TOKEN_ISSUER:}
    token-audience: ${MYPET_TOKEN_AUDIENCE:}
  supabase:
    storage:
      url: ${SUPABASE_URL:}
      service-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      private-bucket: ${SUPABASE_PRIVATE_EVIDENCE_BUCKET:}
    catalog-media:
      url: ${SUPABASE_URL:}
      service-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_CATALOG_MEDIA_BUCKET:catalog-media}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    environment: ${MYPET_ENVIRONMENT:}
  notifications:
    delivery:
      enabled: ${NOTIFICATION_DELIVERY_ENABLED:true}
    device-token-encryption-key: ${MYPET_DEVICE_TOKEN_KEY:}
    worker:
      batch-size: ${NOTIFICATION_BATCH_SIZE:50}
      max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
      fixed-delay-millis: ${NOTIFICATION_FIXED_DELAY_MILLIS:1000}
  cashfree:
    enabled: ${CASHFREE_ENABLED:false}
    client-id: ${CASHFREE_CLIENT_ID:}
    client-secret: ${CASHFREE_CLIENT_SECRET:}
    api-version: ${CASHFREE_API_VERSION:2025-01-01}
    webhook-version: ${CASHFREE_WEBHOOK_VERSION:2025-01-01}
    base-url: ${CASHFREE_BASE_URL:https://sandbox.cashfree.com/pg}
    return-url: ${CASHFREE_RETURN_URL:}
    notify-url: ${CASHFREE_NOTIFY_URL:}
  payments:
    webhook-worker-delay-ms: ${PAYMENT_WEBHOOK_WORKER_DELAY_MS:1000}
    reconciliation-delay-ms: ${PAYMENT_RECONCILIATION_DELAY_MS:15000}
    expiry-delay-ms: ${PAYMENT_EXPIRY_DELAY_MS:5000}
    refund-delay-ms: ${PAYMENT_REFUND_DELAY_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
