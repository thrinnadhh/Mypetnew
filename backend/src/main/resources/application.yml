spring:
  application:
    name: mypetnew-backend
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX:10}
      minimum-idle: ${DATABASE_POOL_MIN:2}
      connection-timeout: 5000
  flyway:
    enabled: true
    schemas: mypet
    default-schema: mypet
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

mypet:
  security:
    token-secret: ${MYPET_TOKEN_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

